<!doctype html>
<!-- Generated by scripts/build.js from src/. Edit the sources, then run `npm run build`. -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>音频播放器</title>
  <style>
<!--@styles-->
  </style>
</head>
<body>
  <div id="startPage" class="page start-page active">
    <div class="start-inner">
      <div class="browser-header">
        <span>选择音频文件</span>
        <button id="browserBackBtn" class="browser-back" type="button" disabled>返回</button>
        <div id="browserPath" class="browser-path">audio</div>
      </div>
      <div id="browserList" class="browser-list">
        <div class="browser-message">正在读取 audio/index.json...</div>
      </div>
    </div>
  </div>

  <div id="playerPage" class="page player-page">
    <div class="topbar">
      <div class="file-name-box">
        <div id="fileProgress" class="file-progress"></div>
        <div id="fileMarks" class="file-marks" aria-hidden="true"></div>
        <span id="fileName" class="file-name">未选择音频</span>
      </div>
      <button id="configBtn" type="button">配置</button>
    </div>
    <div id="progressDragPanel" class="progress-drag-panel">
      <div id="progressDragTrack" class="progress-drag-track">
        <div id="progressDragFill" class="progress-drag-fill"></div>
        <div id="progressDragHandle" class="progress-drag-handle"></div>
        <div id="progressDragTime" class="progress-drag-time">0:00 / 0:00</div>
      </div>
    </div>

    <div id="immersiveView" class="immersive-view">
      <div id="topZone" class="touch-zone touch-zone-top">
        <div class="line-toolbar">
          <button id="maskBtn" type="button">启用遮盖</button>
          <div id="lineCount" class="line-count">0/0</div>
        </div>
        <div id="lineArea" class="line-area">
          <div id="lineCard" class="line-card"></div>
        </div>
        <div id="lineJump" class="line-jump hidden">
          <div id="lineJumpText" class="line-jump-info">0/0</div>
          <input id="lineJumpInput" type="range" min="0" max="0" step="1" value="0" disabled>
        </div>
      </div>
      <div id="middleZone" class="touch-zone touch-zone-middle">
        <div id="playZoneLabel" class="zone-label">点击播放，左右滑动快退/快进</div>
      </div>
      <div id="bottomZone" class="touch-zone touch-zone-bottom">
        <div id="markZoneLabel" class="zone-label">点击打点，左右滑动跳转点位</div>
      </div>
    </div>
    <div id="continuousView" class="continuous-view">
      <div id="transcriptScroll" class="transcript-scroll" tabindex="0" aria-label="全文字幕"></div>
    </div>
  </div>

  <div id="configPage" class="page config-page">
    <div class="config-header">
      <button id="backConfigBtn" type="button">返回</button>
      <div class="config-title">配置</div>
    </div>
    <div class="config-body">
      <div class="config-section">
        <h2>播放</h2>
        <div class="field">
          <label for="forwardStepInput">前进步长（秒）</label>
          <input id="forwardStepInput" type="number" min="1" max="300" step="1">
        </div>
        <div class="field">
          <label for="backStepInput">后退步长（秒）</label>
          <input id="backStepInput" type="number" min="1" max="300" step="1">
        </div>
        <div class="field">
          <label for="markJumpTimeoutInput">连续跳点超时（秒）</label>
          <input id="markJumpTimeoutInput" type="number" min="0.1" max="10" step="0.1">
        </div>
      </div>

      <div class="config-section">
        <h2>点位</h2>
        <div id="markList" class="mark-list"></div>
      </div>

      <div class="config-section">
        <h2>手势</h2>
        <div class="field">
          <label for="swipeThresholdInput">滑动触发阈值 <span id="swipeThresholdValue" class="range-value"></span></label>
          <input id="swipeThresholdInput" type="range" min="30" max="160" step="5">
        </div>
      </div>

      <div class="config-section">
        <h2>界面</h2>
        <div class="field">
          <label for="statusDisplayInput">顶部状态栏显示</label>
          <select id="statusDisplayInput">
            <option value="progress">播放进度</option>
            <option value="title">音频标题</option>
          </select>
        </div>
        <div class="field">
          <label for="showTotalDurationInput">播放进度显示总时长</label>
          <input id="showTotalDurationInput" type="checkbox">
        </div>
        <div class="field">
          <label for="continuousModeInput">全文滚动页面</label>
          <input id="continuousModeInput" type="checkbox">
        </div>
        <div class="field">
          <label for="topRatioInput">上区域占比 <span id="topRatioValue" class="range-value"></span></label>
          <input id="topRatioInput" type="range" min="15" max="60" step="1">
        </div>
        <div class="field">
          <label for="middleRatioInput">中区域占比 <span id="middleRatioValue" class="range-value"></span></label>
          <input id="middleRatioInput" type="range" min="15" max="60" step="1">
        </div>
      </div>

      <div class="config-section">
        <h2>台词</h2>
        <div class="field">
          <label for="lyricsInput">每一行作为一句</label>
          <textarea id="lyricsInput" placeholder="在这里输入台词，每行一句"></textarea>
        </div>
      </div>
    </div>
  </div>

  <audio id="audio"></audio>

  <script>
<!--@scripts-->
  </script>
</body>
</html>
